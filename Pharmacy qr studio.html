<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pharmacy QR Studio - 4K Edition</title>

    <!-- Scanner Library (version pinned so this page can never break from an upstream release) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Advanced QR Code Generator Library -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2dfdb 100%);
            color: #004d40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
            color: #004d40;
            font-size: 2.5em;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 77, 64, 0.1);
        }

        h2 { margin-top: 0; color: #00796b; border-bottom: 2px solid #b2dfdb; padding-bottom: 10px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }

        input[type="text"], input[type="file"], select, input[type="color"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #b2dfdb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .color-row { display: flex; gap: 15px; }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
            background: #00897b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        button:hover { background: #00695c; }

        .btn-row { display: flex; gap: 10px; }
        .btn-png { background: #0288d1; }
        .btn-png:hover { background: #0277bd; }
        .btn-jpg { background: #f57c00; }
        .btn-jpg:hover { background: #ef6c00; }
        .btn-svg { background: #7b1fa2; }
        .btn-svg:hover { background: #6a1b9a; }

        .btn-clear {
            width: auto;
            background: transparent;
            color: #00695c;
            border: 1px solid #b2dfdb;
            font-size: 13px;
            font-weight: normal;
            padding: 6px 12px;
            margin-top: 8px;
            margin-bottom: 0;
        }
        .btn-clear:hover { background: #e0f2f1; }

        #qr-reader { width: 100%; border-radius: 8px; overflow: hidden; background: white; }
        #scan-result { margin-top: 15px; padding: 15px; background: #e0f2f1; border-radius: 8px; word-wrap: break-word; font-size: 16px; }

        /* 3D Effect Classes */
        #qrcode-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.5s ease;
        }

        .effect-3d {
            transform: perspective(600px) rotateX(15deg) rotateY(-15deg);
            box-shadow: 15px 20px 30px rgba(0, 77, 64, 0.4);
            border: 2px solid #b2dfdb;
        }

        #qrcode-label-preview { margin-top: 10px; font-weight: bold; font-size: 18px; text-align: center; }

        .action-btn {
            display: block;
            margin-top: 15px;
            padding: 15px;
            background: #d32f2f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }
        .action-btn:hover { background: #b71c1c; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkbox-container input { width: 20px; height: 20px; cursor: pointer; }

    </style>
</head>
<body>

    <h1>Advanced Pharmacy QR Studio ✚</h1>

    <div class="container">

        <!-- SCANNER SECTION -->
        <div class="card">
            <h2>Scanner</h2>
            <div id="qr-reader"></div>
            <div id="scan-result"><strong>Status:</strong> Awaiting scan...</div>
            <div id="action-area"></div>
        </div>

        <!-- GENERATOR SECTION -->
        <div class="card">
            <h2>Custom Creator</h2>

            <div class="input-group">
                <label>1. QR Code Data (Link or Text)</label>
                <input type="text" id="qr-data" placeholder="https://example.com" oninput="updatePreview()">
            </div>

            <div class="input-group">
                <label>2. Add a Custom Logo (Center of QR)</label>
                <input type="file" id="qr-logo" accept="image/*" onchange="handleLogoUpload(event)">
                <button type="button" class="btn-clear" onclick="clearLogo()">✕ Remove Logo</button>
            </div>

            <div class="input-group">
                <label>3. Add a Custom Name (Bottom label)</label>
                <input type="text" id="qr-label" placeholder="e.g., Dr. Smith's Clinic" oninput="updatePreview()">
            </div>

            <div class="color-row">
                <div class="input-group" style="flex: 1;">
                    <label>QR Color</label>
                    <input type="color" id="qr-color" value="#004d40" onchange="updatePreview()">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Background</label>
                    <input type="color" id="qr-bg" value="#ffffff" onchange="updatePreview()">
                </div>
            </div>

            <div class="color-row">
                <div class="input-group" style="flex: 1;">
                    <label>Dot Style</label>
                    <select id="qr-dot-style" onchange="updatePreview()">
                        <option value="square">Classic Squares</option>
                        <option value="dots">Dots</option>
                        <option value="rounded">Rounded</option>
                        <option value="classy-rounded">Classy</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Corner Style</label>
                    <select id="qr-corner-style" onchange="updatePreview()">
                        <option value="square">Square</option>
                        <option value="dot">Dot</option>
                        <option value="extra-rounded">Extra Rounded</option>
                    </select>
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="toggle-3d" onchange="toggle3DEffect()"> Enable 3D Pop Effect
            </label>

            <div id="qrcode-preview-container">
                <div id="qrcode-canvas"></div>
                <div id="qrcode-label-preview"></div>
            </div>

            <div class="input-group">
                <label>Download Quality</label>
                <select id="qr-quality">
                    <option value="500">Standard (500x500)</option>
                    <option value="1080">Full HD (1080x1080)</option>
                    <option value="3840" selected>4K Ultra HD (3840x3840)</option>
                </select>
            </div>

            <label style="font-weight: bold; display:block; margin-bottom: 5px;">Download Image:</label>
            <div class="btn-row">
                <button class="btn-png" onclick="downloadQRWithText('png')">📥 PNG</button>
                <button class="btn-jpg" onclick="downloadQRWithText('jpeg')">📥 JPEG</button>
                <button class="btn-svg" onclick="downloadQRWithText('svg')">📥 SVG</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SCANNER LOGIC ---
        function onScanSuccess(decodedText) {
            // Built with DOM methods, not innerHTML + string concatenation — a scanned QR
            // code is untrusted input, and could otherwise inject and run HTML/script.
            const resultBox = document.getElementById('scan-result');
            resultBox.innerHTML = "";
            const strong = document.createElement('strong');
            strong.textContent = 'Data Found:';
            resultBox.appendChild(strong);
            resultBox.appendChild(document.createElement('br'));
            resultBox.appendChild(document.createTextNode(decodedText));

            const actionArea = document.getElementById('action-area');
            actionArea.innerHTML = "";

            if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
                const linkBtn = document.createElement("a");
                linkBtn.href = decodedText;
                linkBtn.target = "_blank";
                linkBtn.rel = "noopener noreferrer"; // don't let an unknown scanned site control this tab
                linkBtn.innerText = "🚀 OPEN SCANNED LINK 🚀";
                linkBtn.className = "action-btn";
                actionArea.appendChild(linkBtn);
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess, (err) => { /* Ignore constant scan errors */ });

        // --- 2. GENERATOR LOGIC ---
        let uploadedLogoUrl = "";
        const PREVIEW_SIZE = 250;
        const MARGIN_RATIO = 0.04; // keep the quiet zone proportional at every export size

        function marginFor(size) {
            return Math.round(size * MARGIN_RATIO);
        }

        const qrCode = new QRCodeStyling({
            width: PREVIEW_SIZE,
            height: PREVIEW_SIZE,
            margin: marginFor(PREVIEW_SIZE),
            qrOptions: { typeNumber: 0, mode: "Byte", errorCorrectionLevel: "H" }
        });

        qrCode.append(document.getElementById("qrcode-canvas"));

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedLogoUrl = e.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            } else {
                uploadedLogoUrl = "";
                updatePreview();
            }
        }

        function clearLogo() {
            uploadedLogoUrl = "";
            document.getElementById("qr-logo").value = "";
            updatePreview();
        }

        function updatePreview() {
            const data = document.getElementById("qr-data").value || "https://example.com";
            const label = document.getElementById("qr-label").value;
            const color = document.getElementById("qr-color").value;
            const bg = document.getElementById("qr-bg").value;
            const dotStyle = document.getElementById("qr-dot-style").value;
            const cornerStyle = document.getElementById("qr-corner-style").value;

            const labelPreview = document.getElementById("qrcode-label-preview");
            labelPreview.innerText = label;
            labelPreview.style.color = color;

            qrCode.update({
                data: data,
                image: uploadedLogoUrl || undefined, // "" can confuse the library's image loader — omit it instead
                dotsOptions: { color: color, type: dotStyle },
                cornersSquareOptions: { color: color, type: cornerStyle },
                backgroundOptions: { color: bg },
                imageOptions: { crossOrigin: "anonymous", margin: 5, imageSize: 0.4 }
            });
        }

        function toggle3DEffect() {
            const container = document.getElementById("qrcode-preview-container");
            const isChecked = document.getElementById("toggle-3d").checked;

            if (isChecked) {
                container.classList.add("effect-3d");
            } else {
                container.classList.remove("effect-3d");
            }
        }

        // Initialize preview
        updatePreview();

        // --- 3. HIGH-RES DOWNLOAD LOGIC ---
        function loadImageFromBlob(blob) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error("Could not load the generated QR image."));
                img.src = URL.createObjectURL(blob);
            });
        }

        async function downloadLabeledRaster(extension, qualitySize, labelText, bgColor, fgColor) {
            const blob = await qrCode.getRawData(extension);
            const img = await loadImageFromBlob(blob);

            const textHeight = Math.floor(qualitySize * 0.15); // extra height reserved for the label
            const fontSize = Math.floor(qualitySize * 0.08);   // font scales with resolution

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height + textHeight;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            ctx.fillStyle = fgColor;
            ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText(labelText, canvas.width / 2, img.height + (textHeight / 1.5));

            const link = document.createElement('a');
            link.download = `Custom_QR_Labeled_${qualitySize}p.${extension}`;
            link.href = canvas.toDataURL(`image/${extension}`);
            link.click();

            URL.revokeObjectURL(img.src);
        }

        async function downloadLabeledSVG(qualitySize, labelText, bgColor, fgColor) {
            // Rebuild the SVG's own markup instead of rasterizing it, so an SVG download
            // stays a true vector file even when a label is added underneath it.
            const blob = await qrCode.getRawData('svg');
            const svgText = await blob.text();

            const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
            const svgEl = doc.documentElement;

            const textHeight = Math.floor(qualitySize * 0.15);
            const fontSize = Math.floor(qualitySize * 0.08);
            const newHeight = qualitySize + textHeight;
            const svgNS = "http://www.w3.org/2000/svg";

            svgEl.setAttribute("width", String(qualitySize));
            svgEl.setAttribute("height", String(newHeight));
            svgEl.setAttribute("viewBox", `0 0 ${qualitySize} ${newHeight}`);

            // Background strip behind everything so the label area matches the chosen background.
            const bgRect = doc.createElementNS(svgNS, "rect");
            bgRect.setAttribute("x", "0");
            bgRect.setAttribute("y", "0");
            bgRect.setAttribute("width", String(qualitySize));
            bgRect.setAttribute("height", String(newHeight));
            bgRect.setAttribute("fill", bgColor);
            svgEl.insertBefore(bgRect, svgEl.firstChild);

            // Label drawn on top of everything else.
            const text = doc.createElementNS(svgNS, "text");
            text.setAttribute("x", String(qualitySize / 2));
            text.setAttribute("y", String(qualitySize + (textHeight / 1.5)));
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-family", "'Segoe UI', sans-serif");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("font-size", String(fontSize));
            text.setAttribute("fill", fgColor);
            text.textContent = labelText; // textContent auto-escapes, so this can't break the XML
            svgEl.appendChild(text);

            const finalSvgText = new XMLSerializer().serializeToString(svgEl);
            const finalBlob = new Blob([finalSvgText], { type: "image/svg+xml" });
            const url = URL.createObjectURL(finalBlob);

            const link = document.createElement('a');
            link.download = `Custom_QR_Labeled_${qualitySize}p.svg`;
            link.href = url;
            link.click();

            URL.revokeObjectURL(url);
        }

        async function downloadQRWithText(extension) {
            const labelText = document.getElementById("qr-label").value.trim();
            const bgColor = document.getElementById("qr-bg").value;
            const fgColor = document.getElementById("qr-color").value;
            const qualitySize = parseInt(document.getElementById("qr-quality").value, 10);

            // Scale up to the chosen resolution, keeping the quiet-zone margin proportional.
            qrCode.update({ width: qualitySize, height: qualitySize, margin: marginFor(qualitySize) });

            try {
                if (labelText === "") {
                    await qrCode.download({ name: `Custom_QR_${qualitySize}p`, extension: extension });
                } else if (extension === 'svg') {
                    await downloadLabeledSVG(qualitySize, labelText, bgColor, fgColor);
                } else {
                    await downloadLabeledRaster(extension, qualitySize, labelText, bgColor, fgColor);
                }
            } catch (err) {
                console.error("Error generating combined image:", err);
                alert("Something went wrong saving the High-Res image.");
            } finally {
                // Reset back to the on-screen preview size/margin.
                qrCode.update({ width: PREVIEW_SIZE, height: PREVIEW_SIZE, margin: marginFor(PREVIEW_SIZE) });
            }
        }
    </script>
</body>
</html>
